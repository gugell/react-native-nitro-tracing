name: Validate
on: [push, pull_request]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen && git diff --exit-code -- packages/react-native-nitro-tracing/nitrogen
      - run: pnpm build && pnpm typecheck && pnpm test && pnpm test:native
      - run: pnpm --filter react-native-nitro-tracing test:sentry
      - run: pnpm exec prettier --check .
      - run: clang-format --dry-run --Werror packages/react-native-nitro-tracing/cpp/*.cpp packages/react-native-nitro-tracing/cpp/*.hpp packages/react-native-nitro-tracing/cpp/core/*.cpp packages/react-native-nitro-tracing/cpp/core/*.hpp packages/react-native-nitro-tracing/tests/*.cpp
      - run: pnpm --dir packages/react-native-nitro-tracing pack --pack-destination /tmp
